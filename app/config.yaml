# Arithma config.
# Phase 1: only `game` and `mock` sections are used (mock robot/vision, no hardware).
# Phase 2+: `cameras`, `robot`, and calibration-derived ROIs get filled in.

game:
  rounds_per_game: 3
  # Temporary demo simplification: the robot reliably places one piece into an empty
  # box, but not yet a second piece into an occupied one, so every round is capped at
  # 1 piece per box (every problem is "1 op 1"). Raise this once that skill is
  # reliable - the multi-block generator logic is untouched and ready to resume.
  max_pieces_per_box: 1
  operation_mix: { "+": 1, "-": 1, "*": 1, "/": 1 }
  max_answer: 10
  hand_clear_seconds: 2.0
  count_stable_seconds: 1.5
  feedback_seconds: 3.5

mock:
  robot_seconds_per_piece: 1.0

gui:
  tts_enabled: true
  sound_enabled: true

robot:
  mode: mock   # mock | lerobot  (lerobot = real SO-101 running the trained ACT skills)
  type: so101
  follower_port: /dev/tty.usbmodem5B610367201
  follower_id: my_awesome_follower_arm
  leader_port: /dev/tty.usbmodem5B3D0426861
  max_relative_target: 15.0  # safety cap on per-step joint moves (degrees); PLAN.md §8
  home_pose: null  # filled in by scripts/save_home_pose.py
  policies:
    device: mps
    fps: 30
    min_seconds: 3.0    # don't accept "back home" before the arm has left
    max_seconds: 20.0   # give up on a placement after this long
    home_tolerance: 4.0 # degrees per joint (gripper ignored)
    image_width: 640    # frames are resized to what the policy saw while recording
    image_height: 480
    left:
      path: honestogarrido/act_place_left
      task: Pick a piece from the margin and place it in the left box
    right:
      path: honestogarrido/act_place_right
      task: Pick a piece from the margin and place it in the right box

cameras:
  overhead: 1  # CAMERA_EXTERNAL - fixed, sees the whole board (confirmed via lerobot-find-cameras)
  wrist: 0     # CAMERA_GRIPPER - mounted on the gripper
  width: 640  # capture size; the mat calibration below is in these pixels
  height: 480
  fps: 30

vision:
  mode: mock   # mock | live  (live = real answer-mat camera, INTEGRATION_PLAN.md step 3)
  board_width: 1060
  board_height: 700
  homography:
  - [0.050344, -1.113069, 1022.851141]
  - [-1.868273, -0.006051, 1642.341935]
  - [3.3e-05, -4.9e-05, 1.0]
  rois:
    left_box: [215, 165, 485, 535]
    right_box: [575, 165, 845, 535]
    margin: [0, 0, 1060, 700]
    mat_camera_px:
    - [1170, 89]
    - [1752, 86]
    - [1746, 840]
    - [1181, 850]
