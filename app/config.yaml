# Robot Maths Tutor config.
# Phase 1: only `game` and `mock` sections are used (mock robot/vision, no hardware).
# Phase 2+: `cameras`, `robot`, and calibration-derived ROIs get filled in.

game:
  rounds_per_game: 10
  operation_mix: { "+": 4, "-": 3, "*": 3 }
  max_answer: 10
  hand_clear_seconds: 2.0
  count_stable_seconds: 1.5
  feedback_seconds: 3.5

mock:
  robot_seconds_per_piece: 1.0

gui:
  tts_enabled: true
  sound_enabled: true

robot:
  type: so101
  follower_port: null
  leader_port: null
  home_pose: null

cameras:
  overhead: 1  # CAMERA_EXTERNAL - fixed, sees the whole board (confirmed via lerobot-find-cameras)
  wrist: 0     # CAMERA_GRIPPER - mounted on the gripper

vision:
  board_width: 1060
  board_height: 700
  homography:
  - [0.050344, -1.113069, 1022.851141]
  - [-1.868273, -0.006051, 1642.341935]
  - [3.3e-05, -4.9e-05, 1.0]
  rois:
    left_box: [215, 165, 485, 535]
    right_box: [575, 165, 845, 535]
    margin: [0, 0, 1060, 700]
    mat_camera_px:
    - [1170, 89]
    - [1752, 86]
    - [1746, 840]
    - [1181, 850]
